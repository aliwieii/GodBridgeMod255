name: Build GodBridgeUltra

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 8
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Inspect repository
        shell: bash
        run: |
          echo "===== Repository files ====="
          find . -maxdepth 4 -type f | sort | head -300

          echo "===== Gradle files ====="
          find . -type f \( \
            -name 'build.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'settings.gradle.kts' -o \
            -name 'gradlew' \
          \) -print

          echo "===== ZIP and JAR files ====="
          find . -type f \( -name '*.zip' -o -name '*.jar' \) -print

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon --stacktrace build
          elif [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            gradle --no-daemon --stacktrace build
          else
            echo "::error::No Gradle build file found at repository root."
            echo "Inspect the repository listing above."
            exit 1
          fi

      - name: Locate build outputs
        if: success()
        shell: bash
        run: |
          find . -type f -path '*/build/libs/*.jar' -print

      - name: Upload JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GodBridgeUltra-JAR
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
