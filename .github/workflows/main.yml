name: Merge GodBridgeUltra Archive

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  merge:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '8'

      - name: Inspect and merge archive
        shell: bash
        run: |
          set -euo pipefail

          echo "===== Repository files ====="
          find . -type f \
            ! -path './.git/*' | sort

          mapfile -t ZIPS < <(
            find . -type f -iname '*.zip' \
              ! -path './.git/*' \
              ! -path './.github/*'
          )

          mapfile -t JARS < <(
            find . -type f -iname '*.jar' \
              ! -path './.git/*' \
              ! -path './.github/*'
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one ZIP archive."
            printf 'Found: %s\n' "${ZIPS[@]}"
            exit 1
          fi

          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one input JAR."
            printf 'Found: %s\n' "${JARS[@]}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"
          JAR="${JARS[0]}"

          echo "Archive: $ZIP"
          echo "Input JAR: $JAR"

          WORK="$RUNNER_TEMP/godbridge"
          mkdir -p "$WORK/extracted" dist

          unzip -q "$ZIP" -d "$WORK/extracted"

          SRC="$WORK/extracted"

          shopt -s dotglob nullglob
          ENTRIES=("$SRC"/*)

          if [ "${#ENTRIES[@]}" -eq 1 ] &&
             [ -d "${ENTRIES[0]}" ]; then
            SRC="${ENTRIES[0]}"
          fi

          echo "===== Archive contents ====="
          find "$SRC" -type f | sort

          if ! find "$SRC" -type f \
            -name '*.class' -print -quit | grep -q .; then
            echo "::error::No compiled .class files found."
            echo "The archive cannot be merged as compiled mod files."
            echo "Source-only archives require a proper build process."
            exit 1
          fi

          OUTPUT="dist/GodBridgeUltra-merged.jar"
          cp "$JAR" "$OUTPUT"

          # Remove old signatures invalidated by modifications.
          zip -q -d "$OUTPUT" \
            'META-INF/*.SF' \
            'META-INF/*.RSA' \
            'META-INF/*.DSA' || true

          # Overlay archive files onto the copied JAR.
          jar uf "$OUTPUT" -C "$SRC" .

          echo "===== Result ====="
          jar tf "$OUTPUT" | head -200
          ls -lh "$OUTPUT"

      - name: Upload merged JAR
        uses: actions/upload-artifact@v4
        with:
          name: GodBridgeUltra-Merged
          path: dist/GodBridgeUltra-merged.jar
          if-no-files-found: error
          retention-days: 14
